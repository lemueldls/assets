when:
  - event: [push, manual]
    branch: [main]

engine: nixery

dependencies:
  nixpkgs:
    - cachix
    - jq

steps:
  - name: Use cache
    command: cachix use lemueldls
    environment:
      USER: root

  - name: Build flake
    command: |
      nix flake archive --json | jq -r '.path,(.inputs|to_entries[].value.path)' | cachix push lemueldls
      nix build --print-out-paths .#iosevka-book .#iosevka-slim .#iosevka-code .#iosevka-term .#sarasa-gothic .#wallpapers | cachix push lemueldls
