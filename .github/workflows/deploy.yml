name: Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up SSH signing key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SIGNING_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          git config --global gpg.format ssh
          git config --global user.signingKey ~/.ssh/id_ed25519
          git config --global user.name "Lemuel DLS"
          git config --global user.email "noreply@git.lemueldls.dev"

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: lemueldls
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake
        run: nix flake update

      - name: Build flake
        run: |
          nix flake archive --json | jq -r '.path,(.inputs|to_entries[].value.path)'
          nix build --print-out-paths

      - name: Add and commit changes
        run: |
          git add -A
          git commit -S -m "chore: update flake" || echo "No changes to commit"
          git push

      - name: Copy assets
        run: |
          mkdir -p public
          cp -r result/share/fonts public
          cp -r result/share/wallpapers/assets/contents/images public/wallpapers

      - name: Install compression utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y oxipng jpegoptim

      - name: Compress images
        run: |
          echo "Optimizing PNG files..."
          # -o 4: High optimization, -i 0: Remove interlacing, --strip safe: Keep critical chunks only
          find public/wallpapers -type f -name "*.png" -exec oxipng -o 4 -i 0 --strip safe {} +

          echo "Optimizing JPEG files..."
          # --strip-all: Removes EXIF/metadata, -m100: Retains 100% original visual quality (lossless)
          find public/wallpapers -type f -name "*.jpg" -o -name "*.jpeg" -exec jpegoptim --strip-all -m100 {} +

      - name: Generate index
        run: |
          cd public
          find -L * -type f | jq -R . | jq -s . > index.json

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          command: deploy --name assets --compatibility-date 2026-06-20 --assets public
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
